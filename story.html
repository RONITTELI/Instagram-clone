<!DOCTYPE html>
<html>

<head>
    <title>Instagram clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"); -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <style>
        .storyvideo{
            width: 100%;
            height: 100vh;
            background-image: url(img/post1.avif);
            background-size:cover ;
            /* background-repeat: no-repeat; */
            /* background-color: aquamarine; */
        }

        .storyopenbox {
            width: 100%;
            height: 10vh;
            display:grid ;
            align-items: center;
            grid-template-columns: 150px 200px auto;
            
        }

        .storyopenbox img {
            width: 120px;
            height:120px;
            border-radius: 50%;
            margin: 0px 0 0 40px;
        }

        .storyopenbox span {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 40px;
            font-weight: 800;
            margin-left: 50px;
            color: white;

        }

        .storymess {
            width: 100%;
            height: 160px;
            background-color: black;
            position: fixed;
            bottom: 0px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .storymess input{
            width: 60%;
            height: 70%;
            border-radius:80px;
            background-color: transparent;  
            border: 4px solid white;
            color: white;
            font-size: 40px;
            
        }

    

        .storymess input::placeholder {
            color: rgb(187, 180, 180);
            font-size: 40px;
            text-align: center;
        }

        #a11112222 {
            color: white;
        }

        #a12 {
            color: white;

        }

        #a11 {
            color: rgb(255, 0, 102);
        }

     
    </style>
        <div class="storyvideo">
           <div class="storyopenbox">

            <img src="img/images (2).jpg" alt="">
            <span>Sofia</span>

            <div style="text-align: end; width: auto; padding-right: 40px;">
               <a href="index.html"> <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
              </svg></a>
            </div>
           </div>


           <div class="storymess">
            <input type="text" placeholder="Send messeng">
            <div style="display: flex; gap: 40px; ">

                <svg id="a11" xmlns="http://www.w3.org/2000/svg" style="display: none;" width="70" height="70" fill="currentColor" class="bi bi-heart-fill" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314z"/>
                  </svg>

                <svg id="a12" xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16">
                    <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/>
                  </svg>

                  <svg id="a11112222" xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
                    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
                  </svg>

            </div>
           </div>
        </div>

        <script>
            $(document).ready(function(){
              $("#a12").click(function(){
                $("#a12").hide();
                $("#a11").show();
              });

              $("#a11").click(function(){
                $("#a11").hide();
                $("#a12").show();
              });
            });

        
            </script>
</body>
</html>
