    .bi {

    body {

    }

    .profilelogo img {
      border-radius: 50%;
      width: 200px;
    }

    .probox1 {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100wh;
      height: 300px;
      background-color: black;
      color: white;
    }

    .probox2 {
      display: grid;
      font-size: 40px;
      text-align: center;
      font-weight: 700;

    }

    .captionbox {
      width: 100wh;
      height: fit-content;
      background-color: black;
      color: white;

    }

    .cap {
      width: 45%;
      height: fit-content;
      /* text-align: center; */
      padding-left: 43px;
      display: grid;
    }

    .cap h1 {
      font-weight: 700;
      font-size: 40px;
    }

    .cap label {
      font-size: 30px;
      color: rgb(196, 221, 243);
      padding-bottom: 5px;

    }

    .Editbox {
      width: auto;
      height: 100px;
      display: grid;
      grid-template-columns: 5fr 5fr 1fr;
      column-gap: 15px;
      margin: 15px;
      background-color: black;

    }

    .Editmenbox {
      /* width: 40%; */
      padding: 15px;
      font-size: 42px;
      font-weight: 700;
      background-color: rgb(41, 41, 41);
      border-radius: 15px;
      color: white;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: space-around;

    }

    .eb1 {
      /* width: 10%; */
      padding: 15px 0px 15px 15px;
      font-size: 42px;
      font-weight: 700;
      background-color: rgb(41, 41, 41);
      border-radius: 15px;
      color: white;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: space-around;

    }

    .lucide {
      color: white;
    }


    .prb2 {
      width: auto;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: space-around;

    }

    .profilebox2 {
      width: auto;
      height: max-content;
      /* background-color: aliceblue; */
    }

    .proimg {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .pi img {
      width: 100%;
      height: 100%;
      background-size: cover;
    }


    .proreel h1 {
      padding-top: 100px;
      color: white;
      font-size: 55px;
      text-align: center;
    }

    .proreel h4 {
      padding-top: 18px;
      color: rgb(40, 40, 222);
      font-size: 35px;
      text-align: center;

    }





    .prophoto {
      padding-top: 400px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }

    #p2 {
      display: none;
    }

    #p3 {
      display: none;
    }

    .o1border {
      width: 330px;
      height: 5px;
      background-color: white;
      margin-bottom: 10px;
      transition: all 0.8s;
    }

    .probox3 {
      border-bottom: 1px solid wheat;

    }

    .commentbox1 {
    width: 100%;
    height: 0px;
    border-radius: 50px 50px 0px 0px;
    background-color: rgb(78, 78, 78);
    position: fixed;

    bottom: 0px;
    transition: all 0.8s;
}

.menubar {

}

  margin-top: 0px;

.menubar label {

  font-weight: 700;
  color: white;
  padding-left: 40px;
