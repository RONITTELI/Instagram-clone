    <style>
        .openmess {
            width: 100%;
            height: 10vh;
            background-color: black;
            color: white;
            display: grid;
            grid-template-columns: 1fr 1fr 3fr 1fr 1fr;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .omprofile {
            width: 150px;
            height: 150px;
            border-radius: 50%;

        }

        .omname {
            width: auto;
            margin-left: 30px;
        }

        .omname label {
            font-size: 40px;
            font-weight: 700;

        }

        .omname h5 {
            font-size: 30px;
            font-weight: 700;
            color: rgb(167, 167, 167);
        }

        .om1 {
            margin-left: 30px;
        }

        .ommenbox {
            height: 90vh;
            background-color: black;

        }

        .ombox1 {
            background-color: rgb(64, 64, 64);
            height: fit-content;
            padding: 30px;
            width:fit-content;
            border-radius: 30px;
            color: white;
            margin-top: 50px;
            margin-left: 20px;
            font-size: 50px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 500;
            float: left;
        }

        .ombox2 {
            width: 95vw;
            height: 130px;
            background-color: rgb(64, 64, 64);
            border-radius: 80px;
            display: grid;
            grid-template-columns: 1fr 5fr 1fr 1fr 1fr;
            align-items: center;
            /* gap: 10px; */
            color: white;


        }

        .ombox2 input {
            border: none;
            background-color: transparent;
            height: 100%;
            outline: none;
            font-size: 40px;
            color: white;

        }

        .ombox2 input::placeholder {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 40px;
            align-items: center;
        }

        .omm1 {
            padding: 15px;
            background-color: rgb(0, 136, 255);
            margin: 0 20px;
            border-radius: 50%;
        }

        a {
            color: white;
        }
    </style>
</head>

    <script>
        function changeText() {
            var spanElement = document.getElementById("dynamicText");
            var inputElement = document.getElementById("newText");
            var newValue = inputElement.value;
            spanElement.textContent = newValue;
        }

        // Attach the changeText function to the input event
        var inputElement = document.getElementById("newText");
        var x = document.getElementById("mymess")
        inputElement.addEventListener("keydown", function (event) {
            // Check if the Enter key is pressed (key code 13)
            if (event.key === "Enter") {
                x.style.display = "block";
                changeText();
            }
        });
    </script>
